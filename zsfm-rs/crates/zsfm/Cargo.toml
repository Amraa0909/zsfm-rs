[package]
name = "zsfm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Single CLI (convert / infer / upload) for every zsfm model, replacing the 11 per-model binaries."
keywords = ["forecasting", "time-series", "machine-learning", "gguf", "foundation-model"]
categories = ["science", "command-line-utilities"]
readme = "../../../README.md"

[[bin]]
name = "zsfm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
safetensors.workspace = true
zsfm-core.workspace = true
zsfm-gguf.workspace = true
zsfm-hub.workspace = true
zsfm-checkpoint.workspace = true
zsfm-burn.workspace = true
zsfm-toto.workspace = true
zsfm-tabfm.workspace = true
zsfm-mitra.workspace = true
zsfm-tabdpt.workspace = true
zsfm-tabicl.workspace = true
zsfm-tabpfn.workspace = true
zsfm-chronos.workspace = true
zsfm-timesfm.workspace = true
zsfm-sundial.workspace = true
zsfm-ttm.workspace = true
zsfm-lag-llama.workspace = true
zsfm-moment.workspace = true
zsfm-moirai.workspace = true
zsfm-moirai2.workspace = true
zsfm-flowstate.workspace = true
zsfm-tirex.workspace = true

# Apple's Accelerate framework only exists on macOS; Burn picks it up
# automatically where available. No per-crate conditionals needed.
