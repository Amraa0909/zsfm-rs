[workspace]
resolver = "2"
members = [
    "crates/zsfm-gguf",
    "crates/zsfm-hub",
    "crates/zsfm-core",
    "crates/zsfm-checkpoint",
    "crates/models/toto",
    "crates/models/tabfm",
    "crates/models/mitra",
    "crates/models/tabdpt",
    "crates/models/tabicl",
    "crates/models/tabpfn",
    "crates/models/chronos",
    "crates/models/timesfm",
    "crates/models/sundial",
    "crates/models/ttm",
    "crates/models/lag_llama",
    "crates/models/moment",
    "crates/models/moirai",
    "crates/models/moirai2",
    "crates/models/flowstate",
    "crates/models/tirex",
    "crates/zsfm",
    "crates/zsfm-python",
    "crates/zsfm-bench",
    "crates/zsfm-burn",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/amaye15/zsfm-rs"
rust-version = "1.82"

[workspace.dependencies]
# Internal crates (path + version, so `cargo publish` accepts them as real
# dependencies rather than dev-only path links). Keep this list's names/paths
# in sync with `members` above; version is inherited from [workspace.package].
zsfm-core = { path = "crates/zsfm-core", version = "0.3.0" }
zsfm-gguf = { path = "crates/zsfm-gguf", version = "0.3.0" }
zsfm-hub = { path = "crates/zsfm-hub", version = "0.3.0" }
zsfm-burn = { path = "crates/zsfm-burn", version = "0.3.0" }
zsfm-checkpoint = { path = "crates/zsfm-checkpoint", version = "0.3.0" }
zsfm-toto = { path = "crates/models/toto", version = "0.3.0" }
zsfm-tabfm = { path = "crates/models/tabfm", version = "0.3.0" }
zsfm-mitra = { path = "crates/models/mitra", version = "0.3.0" }
zsfm-tabdpt = { path = "crates/models/tabdpt", version = "0.3.0" }
zsfm-tabicl = { path = "crates/models/tabicl", version = "0.3.0" }
zsfm-tabpfn = { path = "crates/models/tabpfn", version = "0.3.0" }
zsfm-chronos = { path = "crates/models/chronos", version = "0.3.0" }
zsfm-timesfm = { path = "crates/models/timesfm", version = "0.3.0" }
zsfm-sundial = { path = "crates/models/sundial", version = "0.3.0" }
zsfm-ttm = { path = "crates/models/ttm", version = "0.3.0" }
zsfm-lag-llama = { path = "crates/models/lag_llama", version = "0.3.0" }
zsfm-moment = { path = "crates/models/moment", version = "0.3.0" }
zsfm-moirai = { path = "crates/models/moirai", version = "0.3.0" }
zsfm-moirai2 = { path = "crates/models/moirai2", version = "0.3.0" }
zsfm-flowstate = { path = "crates/models/flowstate", version = "0.3.0" }
zsfm-tirex = { path = "crates/models/tirex", version = "0.3.0" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
byteorder = "1"
reqwest = { version = "0.11", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
safetensors = "0.4"
indicatif = "0.17"
sha2 = "0.10"
base64 = "0.22"
half = "2"
hdf5 = { package = "hdf5-metno", version = "0.10", features = ["static", "f16"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
pytorch-reader = "0.22"
rayon = "1"
simdeez = "3"
csv = "1"
thiserror = "1"
# Portable CPU backend (Burn Flex). No Accelerate feature here: it links
# Apple's Accelerate.framework and only builds on macOS.
burn = { version = "0.22", features = ["flex"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
numpy = "0.23"
ndarray = { version = "0.15", features = ["blas"] }

# Shared by every crate in the workspace so the 11 legacy per-model crates'
# copy-pasted [profile.release] blocks collapse to one definition.
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"

# Faster CI / staging profile: thin LTO, unwind for backtraces, symbols kept.
[profile.release-debug]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
panic = "unwind"
debug = true

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "allow"
unused_must_use = "deny"

[workspace.lints.clippy]
chunks_exact_to_as_chunks = "allow"
manual_div_ceil = "warn"
